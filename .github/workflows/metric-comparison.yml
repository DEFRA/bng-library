name: Metric comparison

# Compares the service, with the engine at this commit, with the Statutory
# Biodiversity Metric, figure by figure (BMD-1036). The comparison, the
# scenario corpus and the metric's answers live in bng-metric-harness; this
# workflow only calls it with the commit to test. The harness checks out
# bng-metric-backend (the branch of the same name as this pull request if
# there is one, otherwise its main) and swaps its bng-library for this
# commit, so a library change that would regress the service is caught
# before it merges rather than when the backend next repins. The job summary
# names the commits compared and leads with any difference nothing explains;
# the full report (report.html and report.xlsx) is in the run's artifacts.
#
# - Pull requests: the branch's head commit.
# - Merge queue (merge_group): the queue's merge commit. The trigger is what
#   lets the comparison be a required check: without it the queue would wait
#   for a status that never arrives. Whether it gates the merge is set by the
#   ruleset on main, not here.
#
# Pushes to main aren't compared here: the harness compares bng-library's
# main with the backend on each of its merges, three times each weekday and
# on each backend publish.

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  compare:
    name: Compare the service with the metric
    # bng-metric-harness is public and exposes workflow_call, so this runs
    # on this repo's own GITHUB_TOKEN. No PAT or repository_dispatch needed.
    # With library-sha, the harness runs one leg, "library candidate". A
    # newer push to a pull request cancels the run in flight.
    uses: DEFRA/bng-metric-harness/.github/workflows/metric-comparison.yml@main
    with:
      # Pin to the commit under test, not a branch name, so a push landing
      # while the job queues cannot swap the code under test. For a pull
      # request that is the branch's head, not GitHub's merge commit; for a
      # merge group, the queue's merge commit.
      library-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      library-ref: ${{ github.head_ref || github.ref_name }}
